      <span class="logo-icon" aria-hidden="true">⚡</span>

      <button class="btn-icon btn-install" id="btnInstall" title="تثبيت التطبيق" aria-label="تثبيت التطبيق على الجهاز" hidden>

        <span aria-hidden="true">📝</span>
      </button>
    </nav>

        🛠️ المشاريع

      </button>

        📖 القاموس
      </button>

  <main class="main-content" id="mainContent" role="main" aria-live="polite">

    <section class="page active" id="page-home" aria-label="الصفحة الرئيسية"></section>

    <section class="page" id="page-category" aria-label="قسم الدروس"></section>

    <section class="page" id="page-dictionary" aria-label="قاموس المصطلحات الكهربائية"></section>

  <div id="calcModalContainer" role="dialog" aria-modal="true" aria-label="الحاسبة الهندسية" hidden></div>

  <script src="./simulator/simulator-project.js"></script>
  <script src="./simulator/simulator-ui.js"></script>
  <script src="./simulator/simulator.js"></script>

  <!-- Main Application (Must load last) -->
